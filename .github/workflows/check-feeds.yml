name: Check RSS Feeds

# 媒體改版或停掉 feed 時不會有人通知我們。ingestNews 的設計是單一來源
# 失敗就跳過繼續跑，這對穩定性是對的，但也代表某家默默失效不會有人發現。
# 這支每週跑一次，來源掛掉時讓 GitHub 寄失敗通知。
on:
  schedule:
    # 每週一早上 9 點（台北時間 UTC+8，即 UTC 01:00）
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 只讀不寫，不需要資料庫連線
      - name: Check feed health
        run: npx tsx scripts/checkFeeds.ts
